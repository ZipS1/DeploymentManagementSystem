name: projectops

services:
  app:
    image: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    environment:
      - PG_PASSWORD=${PG_PASSWORD}
    ports:
      - "80:8080"
    networks:
      - projectops
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ProjectOps
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - projectops
    restart: always

networks:
    projectops:

volumes:
  postgres_data:
