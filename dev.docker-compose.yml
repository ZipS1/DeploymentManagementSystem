name: projectops

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PG_PASSWORD=${PG_PASSWORD}
    ports:
      - "8080:80"
    networks:
      - projectops
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ProjectOps
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - projectops

networks:
    projectops:

volumes:
  postgres_data: